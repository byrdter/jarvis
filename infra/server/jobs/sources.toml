# What JARVIS collects every morning. Focus: building with AI (models, agents, tools, Claude Code,
# techniques, prices and limits), not general AI news. Decided with Terry 2026-11-15.
#
# Each [[source]]: id (unique, never rename: dedupe state is keyed on it), name, kind, max (new items
# kept per run), plus the kind's field:
#   rss              url      RSS or Atom feed (GitHub releases are Atom: github.com/OWNER/REPO/releases.atom)
#   sitemap          url      new pages under `prefix` in a sitemap (for sites without a feed)
#   hn               (none)   Hacker News stories from the last day, points >= min_points, AI keywords
#   github-trending  (none)   new repos (last 14 days) about agents/LLMs/MCP, by stars
#   hf-trending      (none)   trending models on Hugging Face
#   youtube          channel_id   newest uploads: title + description (no transcripts yet)
#
# Adding a source: append a block, run `collect.py --dry-run --only <id>` on the server, deploy.

