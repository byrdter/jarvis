<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Brain</title>
<style>
  :root {
    --bg: #f7f5f0; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6a62; --line: #e4e0d6;
    --accent: #b8860b; --me: #efe9da; --cite: #8a6408;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15161a; --panel: #1e1f24; --ink: #ececea; --muted: #9a978f; --line: #2e3037;
            --accent: #e0b041; --me: #2a2a2f; --cite: #e0b041; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { max-width: 820px; margin: 0 auto; padding: 22px 16px 6px; display: flex;
           align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  #status { color: var(--muted); font-size: 13px; }
  main { max-width: 820px; margin: 0 auto; padding: 8px 16px 140px; }
  .turn { margin: 18px 0; }
  .q { background: var(--me); border-radius: 12px; padding: 10px 14px; display: inline-block; max-width: 100%; }
  .a { padding: 10px 2px; white-space: pre-wrap; }
  .a .c { color: var(--cite); font-weight: 600; cursor: pointer; }
  .wait { color: var(--muted); font-style: italic; }
  details.src { border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
                margin: 6px 0; font-size: 14px; }
  details.src summary { padding: 7px 12px; cursor: pointer; color: var(--muted); }
  details.src summary b { color: var(--ink); font-weight: 600; }
  details.src pre { margin: 0; padding: 4px 12px 12px; white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 26px; }
  .hint button { margin: 4px 6px 0 0; }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%);
         padding: 26px 16px 18px; }
  .bar { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; height: 52px; padding: 13px 14px; border-radius: 12px;
             border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px;
           padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .send { background: var(--accent); color: #fff; border: 0; padding: 0 20px; font-size: 16px; font-weight: 600; }
  .send:disabled { opacity: .5; }
</style>
</head>
<body>
<header><h1>Ask the <span>Brain</span></h1><div id="status">checking…</div></header>
<main id="log">
  <div class="hint" id="hint">Answers come only from your brain, on this laptop, for free. Every fact has a
  source number; open a source to check it.<br>
    <button>What time does the morning brief go out?</button>
    <button>What did we decide about the avatar?</button>
    <button>Which local model is the everyday pick, and why?</button>
  </div>
</main>
<form id="f"><div class="bar">
  <textarea id="q" placeholder="Ask the brain…  (Enter to send, Shift+Enter for a new line)"></textarea>
  <button class="send" id="go">Ask</button>
</div></form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), go = document.getElementById('go');
const history = [];
fetch('/status').then(r => r.json()).then(s => {
  document.getElementById('status').textContent = `${s.model} · ${s.files} files · ${s.sections} sections · offline`;
}).catch(() => { document.getElementById('status').textContent = 'server not answering'; });

document.querySelectorAll('.hint button').forEach(b => b.onclick = e => { e.preventDefault(); ask(b.textContent); });
document.getElementById('f').onsubmit = e => { e.preventDefault(); ask(q.value); };
q.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(q.value); } };

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function render(a, text, srcs) {
  a.textContent = '';
  const parts = text.split(/(\[\d+(?:,\s*\d+)*\])/);
  for (const p of parts) {
    if (/^\[\d+(?:,\s*\d+)*\]$/.test(p)) {
      const s = el('span', 'c', p);
      s.onclick = () => { const n = parseInt(p.slice(1)); const d = srcs[n - 1]; if (d) { d.open = true; d.scrollIntoView({behavior: 'smooth', block: 'center'}); } };
      a.appendChild(s);
    } else a.appendChild(document.createTextNode(p));
  }
}

async function ask(text) {
  text = text.trim(); if (!text || go.disabled) return;
  document.getElementById('hint')?.remove();
  q.value = ''; go.disabled = true;
  const turn = el('div', 'turn'); turn.appendChild(el('div', 'q', text));
  const a = el('div', 'a wait', 'Searching the brain…'); turn.appendChild(a);
  const box = el('div'); turn.appendChild(box);
  log.appendChild(turn); turn.scrollIntoView({behavior: 'smooth'});
  let answer = '', srcs = [];
  try {
    const r = await fetch('/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                   body: JSON.stringify({question: text, history})});
    if (!r.ok) throw new Error(await r.text());
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line.trim()) continue;
        const m = JSON.parse(line);
        if (m.sources) {
          a.textContent = 'Reading ' + m.sources.length + ' sources…';
          srcs = m.sources.map((s, n) => {
            const d = el('details', 'src'); const sum = el('summary');
            sum.appendChild(el('b', null, `[${n + 1}] `)); sum.appendChild(document.createTextNode(`${s.file} · ${s.label}`));
            d.appendChild(sum); d.appendChild(el('pre', null, s.text)); box.appendChild(d); return d;
          });
        }
        if (m.text) { answer += m.text; a.className = 'a'; render(a, answer, srcs); }
      }
    }
  } catch (e) { a.className = 'a'; a.textContent = 'Error: ' + e.message; }
  history.push({role: 'user', content: text}, {role: 'assistant', content: answer});
  go.disabled = false; q.focus();
}
</script>
</body>
</html>
