<!-- ============================================================================
     ANNOTATION HUD — lock a dark analysis overlay onto a REAL captured page.

     For any beat where the argument is carried by someone else's published page and the VO
     names specific rows aloud. The capture stays untouched underneath; the HUD acquires
     rows, brackets two of them, draws a flat line across a run, and marks a step change.

     ---- THE RULE THIS COMPONENT EXISTS TO PROTECT ---------------------------------
     Rendering a LOOKALIKE of a third party's page is the fabrication VISUAL-SOURCING §9
     forbids. The HUD may draw boxes, ratios and labels OVER the capture; the rates must be
     the capture's own pixels. Nothing here writes a number onto the page — labels sit in
     dark chips OUTSIDE the table body, connected by a leader line.

     ---- COORDINATES COME FROM A MEASUREMENT, NEVER BY HAND ------------------------
     Pass the JSON emitted by `tools/measure-capture-table.py` as `geometry`, plus a
     `rows` map from semantic name -> band index. Re-capture the page and you re-run the
     measurement; you do not edit this file or the scene. Hand-copied pixel coordinates are
     the thing that rots the instant anyone re-takes a capture.

     The band ORDER is not semantics. Crop the bands, READ them, and only then write the
     `rows` map. (Done for C5 on 2026-08-04 — all 12 bands confirmed against pixels.)

     ---- FRAMING -------------------------------------------------------------------
     A framing is a SOURCE RECTANGLE {sx, sy, sw}; scale and translate are derived from the
     viewport box, so you author in the capture's own coordinate space. Prefer a scale <= 1
     on a 4K capture: at 3840 wide, showing 1643 source px inside a 1380px viewport is a
     0.84x DOWNSCALE — natively sharp, and ~2x the apparent size of the whole page. Never
     crop-and-upscale to fill the frame; that soft-focuses the one asset that must read as
     real, and legibility on a phone is the whole point.

     Keep the viewport clear of the spine rail (x 64-448). Default box starts at x=500.

     ---- USAGE ---------------------------------------------------------------------
       BLOCK A -> scene <style>;  BLOCK B -> a child of #root;  BLOCK C -> after the
       scene's own tl calls. All times MASTER-ABSOLUTE; sceneStart is subtracted here.

         mountHUD(tl, {
           sceneStart: 306.8,
           capture:  'assets/C5-pricing-still.png',
           geometry: C5_GEO,                       // from measure-capture-table.py
           rows: {'opus-5':2, 'opus-4.1':7, 'opus-4':8},
           viewport: {x:500, y:90, w:1380, h:900},
           framings: {
             wide:  {sx:680,  sy:40,   sw:2380},   // browser chrome + page head
             table: {sx:1049, sy:1000, sw:1643}    // the model-pricing table
           },
           start: 'wide',
           moves: [{to:'table', at:310.0, dur:1.8}],
           cues: [
             {t:'kicker',   at:307.0, text:'ANTHROPIC · PUBLISHED RATES'},
             {t:'acquire',  at:310.6, row:'opus-4',   label:'$15 / $75'},
             {t:'bracket',  at:327.8, from:'opus-5', to:'opus-4', label:'3x CHEAPER'},
             {t:'flatline', at:372.6, from:'opus-5', to:'opus-4.5', label:'NO CHANGE'},
             {t:'step',     at:389.6, from:'sonnet-aug', to:'sonnet-sep',
                            label:'+50%', tone:'rise'},
             {t:'release',  at:356.7}
           ]
         });

     `tone:'rise'` switches an element to the crimson accent. Use it ONLY for a move in the
     opposite direction to the scene's argument — that is a deliberate comparison split
     under CONDUIT §2, not a second decorative colour. It is deliberately NOT the spine's
     provisional amber, which means something else entirely ("we wrote this and it was wrong").

     ---- RENDERER SAFETY -----------------------------------------------------------
     Every annotation is its own element; nothing loops; no element is tweened twice on one
     property in overlapping windows. Past-dated cues are applied with a bare gsap.set at
     mount time — a zero-duration tween parked at position 0 never ticks when the playhead
     is already at 0 (learned the hard way on spine-ledger, 2026-08-04). All motion that IS
     motion sits on the registered tl; a bare gsap.to renders FROZEN.
============================================================================ -->

<!-- ============================ BLOCK A — style ============================ -->
<style>
  #hud{position:absolute;z-index:10;overflow:hidden;opacity:0;
       border:1px solid rgba(201,178,122,.20);border-radius:4px;
       box-shadow:0 34px 100px rgba(0,0,0,.62)}
  /* TWO nested transforms, deliberately. #hud-drift carries ONE continuous whole-scene
     move so the capture is never perfectly still; #hud-cap carries the discrete framing
     moves. Putting both on one element would be two tweens on one property in overlapping
     windows — the exact pattern that renders FROZEN. */
  #hud .hud-drift{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform}
  #hud .hud-cap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #hud .hud-cap img{display:block}
  /* annotations live ABOVE the capture, inside the same clipped box */
  #hud-ann{position:absolute;inset:0;z-index:3}

  /* --- acquire: corner brackets + a tint band locked to one row --- */
  #hud .hq{position:absolute;opacity:0}
  #hud .hq-tint{position:absolute;inset:0;background:rgba(201,178,122,.16);
      border-top:1px solid rgba(201,178,122,.55);border-bottom:1px solid rgba(201,178,122,.55);
      transform:scaleX(0);transform-origin:0 50%}
  #hud .hq-c{position:absolute;width:16px;height:16px;border:2px solid #C9B27A}
  #hud .hq-tl{left:-1px;top:-1px;border-right:0;border-bottom:0}
  #hud .hq-tr{right:-1px;top:-1px;border-left:0;border-bottom:0}
  #hud .hq-bl{left:-1px;bottom:-1px;border-right:0;border-top:0}
  #hud .hq-br{right:-1px;bottom:-1px;border-left:0;border-top:0}
  #hud .hq.is-rise .hq-tint{background:rgba(217,112,90,.16);
      border-top-color:rgba(217,112,90,.62);border-bottom-color:rgba(217,112,90,.62)}
  #hud .hq.is-rise .hq-c{border-color:#D9705A}

  /* --- chips: every label sits in a dark chip OUTSIDE the table body --- */
  #hud .hchip{position:absolute;opacity:0;background:rgba(12,16,22,.95);
      border-left:3px solid #C9B27A;padding:7px 13px 7px 11px;border-radius:3px;
      font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:.06em;
      color:#EBE4D2;font-weight:700;white-space:nowrap;
      box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #hud .hchip.is-rise{border-left-color:#D9705A;color:#F3C9BE}
  #hud .hchip.is-sm{font-size:15px;letter-spacing:.16em;color:#C9B27A;font-weight:700;
      padding:6px 12px}
  #hud .hlead{position:absolute;height:1px;background:#C9B27A;opacity:.75;
      transform:scaleX(0);transform-origin:0 50%}
  #hud .hlead.is-rise{background:#D9705A}

  /* --- pointer: a throbbing arrow on the row the VO is talking about RIGHT NOW.
         Ambient motion on a DEDICATED element that no discrete tween ever touches — that is
         the documented-safe way to loop (bed-drift/spine-ledger headers). The freeze bug was
         a loop sharing a PROPERTY with a discrete tween on the SAME element; this shares
         nothing. It is what keeps the frame alive between discrete beats. --- */
  #hud .hpt{position:absolute;opacity:0;width:19px;height:26px}
  #hud .hpt-in{position:absolute;left:0;top:0;width:0;height:0;
      border-top:13px solid transparent;border-bottom:13px solid transparent;
      border-left:19px solid #C9B27A;filter:drop-shadow(0 0 6px rgba(201,178,122,.55))}
  #hud .hpt.is-rise .hpt-in{border-left-color:#D9705A}

  /* --- bracket: a vertical brace spanning two rows --- */
  #hud .hbr{position:absolute;opacity:0}
  #hud .hbr-spine{position:absolute;left:0;top:0;width:2px;height:100%;background:#C9B27A;
      transform:scaleY(0);transform-origin:50% 0}
  #hud .hbr-t,#hud .hbr-b{position:absolute;left:0;width:20px;height:2px;background:#C9B27A}
  #hud .hbr-t{top:0} #hud .hbr-b{bottom:0}

  /* --- flatline: a rule drawn across a run of rows --- */
  #hud .hfl{position:absolute;height:2px;background:#C9B27A;opacity:.9;
      transform:scaleX(0);transform-origin:0 50%}

  /* --- step: an arrow FROM one row TO another. The head marks the `to` row — the arrow
         must point at the row being moved TO, not merely "upward". Colour + the delta
         label carry the direction of the change; the arrow carries WHICH ROW. --- */
  #hud .hst{position:absolute;width:2px;background:#D9705A;opacity:0;
      transform:scaleY(0);transform-origin:50% 100%}
  #hud .hst.is-down{transform-origin:50% 0}
  #hud .hst-head{position:absolute;left:-5px;top:-2px;width:0;height:0;
      border-left:6px solid transparent;border-right:6px solid transparent;
      border-bottom:9px solid #D9705A}
  #hud .hst.is-down .hst-head{top:auto;bottom:-2px;border-bottom:0;
      border-top:9px solid #D9705A}

  /* --- kicker: the source label. OUTSIDE the clipped box, sitting above it.
         Inside, it covers the capture's first table row — which is content the viewer is
         supposed to be reading. Never put chrome on top of the evidence. --- */
  #hud-kick{position:absolute;z-index:11;opacity:0;
      font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.24em;
      color:#C9B27A;font-weight:700;white-space:nowrap}
</style>

<!-- =========================== BLOCK B — markup =========================== -->
<!-- child of #root. Capture + annotation layer are injected by mountHUD. -->
<div id="hud">
  <div class="hud-drift" id="hud-drift"><div class="hud-cap" id="hud-cap"></div></div>
  <div id="hud-ann"></div>
</div>
<div id="hud-kick"></div>

<!-- =========================== BLOCK C — script =========================== -->
<script>
function mountHUD(tl, o){
  var S   = o.sceneStart || 0;
  var vp  = o.viewport || {x:500, y:90, w:1380, h:900};
  var geo = o.geometry, rowmap = o.rows || {}, cues = o.cues || [];
  var FR  = o.framings || {};

  function L(t){ return t - S; }
  function past(t){ return L(t) < 0; }
  function endState(to){ var e={}; for (var k in to) if (k!=='duration'&&k!=='ease') e[k]=to[k];
                         return e; }
  // Skip missing targets silently. Not every cue type builds every part — a `bracket` has
  // no leader line, a `release` has no element of its own — and GSAP logs a console warning
  // per missing target, which `hyperframes check` (correctly) surfaces as a runtime warning.
  function has(sel){ return !!sel && !!document.querySelector(sel); }
  function at(sel, from, to, t, x){
    if (!has(sel)) return;
    if (past(t)){ gsap.set(sel, endState(to)); return; }
    tl.fromTo(sel, from, to, L(t) + (x||0));
  }
  function to_(sel, to, t, x){
    if (!has(sel)) return;
    if (past(t)){ gsap.set(sel, endState(to)); return; }
    tl.to(sel, to, L(t) + (x||0));
  }

  // ---- the capture box ---------------------------------------------------------------
  var box = document.getElementById('hud');
  box.style.left = vp.x + 'px'; box.style.top    = vp.y + 'px';
  box.style.width= vp.w + 'px'; box.style.height = vp.h + 'px';
  var capEl = document.getElementById('hud-cap');
  // A 4K capture inside a 1380px clipped box overflows by design — that IS the framing.
  // Declare it, or the layout checker flags container_overflow/escaped_container on every
  // sample. The declaration belongs on the WRAPPER, not just the img.
  capEl.setAttribute('data-layout-allow-overflow', '');
  capEl.innerHTML =
    '<img src="' + o.capture + '" width="' + geo.size[0] + '" height="' + geo.size[1] +
    '" alt="" data-layout-allow-overflow />';

  // A framing is a SOURCE RECT. Scale/translate are derived — author in capture space.
  function frame(f){
    var s = vp.w / f.sw;
    return { scale:s, x: -f.sx * s, y: -f.sy * s };
  }
  var cur = frame(FR[o.start] || FR[Object.keys(FR)[0]]);

  // capture-space -> viewport-space, under a given framing
  function px(f, sxv, syv){ return { x: sxv * f.scale + f.x, y: syv * f.scale + f.y }; }

  // Annotations are pinned under the framing that is active WHEN THEY FIRE. Resolve each
  // cue's framing by walking the moves that complete before it.
  function framingAt(t){
    var f = FR[o.start] || FR[Object.keys(FR)[0]];
    (o.moves || []).forEach(function(m){ if (m.at + (m.dur || 0) <= t + 0.001) f = FR[m.to]; });
    return frame(f);
  }

  function rowRect(f, name){
    var idx = rowmap[name];
    if (idx == null || !geo.rows[idx]) { console.warn('[hud] unknown row "' + name + '"'); return null; }
    var r  = geo.rows[idx];
    var a  = px(f, geo.x0, r.y0 - 8), b = px(f, geo.x1, r.y1 + 8);
    return { x:a.x, y:a.y, w:b.x - a.x, h:b.y - a.y, cy:(a.y + b.y)/2 };
  }

  // ---- build every annotation up front at opacity 0; nothing reflows -------------------
  var ann = document.getElementById('hud-ann');
  ann.innerHTML = '';
  var made = [], noteY = 150;   // gutter cursor for stacked `note` chips
  cues.forEach(function(c, i){
    var f = framingAt(c.at), id = 'hud-c' + i, el, rise = (c.tone === 'rise');

    if (c.t === 'kicker'){
      // lives outside the clipped box (see the CSS note) — set it, don't append it
      var kick = document.getElementById('hud-kick');
      kick.textContent = c.text;
      kick.style.left = vp.x + 'px';
      kick.style.top  = (vp.y - 34) + 'px';
      return;

    } else if (c.t === 'acquire'){
      var r = rowRect(f, c.row); if (!r) return;
      el = document.createElement('div');
      el.className = 'hq' + (rise ? ' is-rise' : ''); el.id = id;
      el.style.cssText += 'left:' + r.x + 'px;top:' + r.y + 'px;width:' + r.w +
                          'px;height:' + r.h + 'px';
      el.innerHTML = '<div class="hq-tint" id="' + id + '-t"></div>' +
        '<div class="hq-c hq-tl"></div><div class="hq-c hq-tr"></div>' +
        '<div class="hq-c hq-bl"></div><div class="hq-c hq-br"></div>';
      if (c.label) made.push(chip(id + '-L', c.label, r.x + r.w + 26, r.cy, rise, r.x + r.w, r.cy));

    } else if (c.t === 'pointer'){
      var rp = rowRect(f, c.row); if (!rp) return;
      el = document.createElement('div');
      el.className = 'hpt' + (rise ? ' is-rise' : ''); el.id = id;
      el.style.cssText += 'left:' + (rp.x - 34) + 'px;top:' + (rp.cy - 13) + 'px';
      el.innerHTML = '<div class="hpt-in" id="' + id + '-in"></div>';

    } else if (c.t === 'note'){
      // An argument beat that is NOT anchored to a row — "not a discount", "fell by two
      // thirds". Stacks down the gutter under whatever is already there.
      //
      // These exist because a held capture with nothing happening is a dead frame: S05 ran
      // 28.9s between its last cue and its release and measured ZERO change events across
      // the whole scene (2026-08-04). A beat every ~3-5s is not decoration, it is the floor.
      // Notes are still LABELS, never a restatement of a number off the page.
      var gx = px(f, geo.x1, 0).x + 26;          // just right of the table, in the gutter
      var ny = (c.y != null) ? c.y : (noteY += 60);
      made.push(chip(id + '-L', c.text, gx, ny, rise, null, null));
      return;

    } else if (c.t === 'bracket'){
      var a1 = rowRect(f, c.from), b1 = rowRect(f, c.to); if (!a1 || !b1) return;
      var top = Math.min(a1.y, b1.y), bot = Math.max(a1.y + a1.h, b1.y + b1.h);
      el = document.createElement('div'); el.className = 'hbr'; el.id = id;
      el.style.cssText += 'left:' + (a1.x + a1.w + 12) + 'px;top:' + top +
                          'px;height:' + (bot - top) + 'px;width:20px';
      el.innerHTML = '<div class="hbr-spine" id="' + id + '-s"></div>' +
                     '<div class="hbr-t"></div><div class="hbr-b"></div>';
      if (c.label) made.push(chip(id + '-L', c.label, a1.x + a1.w + 46, (top + bot) / 2,
                                  rise, null, null));

    } else if (c.t === 'flatline'){
      var a2 = rowRect(f, c.from), b2 = rowRect(f, c.to); if (!a2 || !b2) return;
      var cy = (Math.min(a2.cy, b2.cy) + Math.max(a2.cy, b2.cy)) / 2;
      el = document.createElement('div'); el.className = 'hfl'; el.id = id;
      el.style.cssText += 'left:' + a2.x + 'px;top:' + cy + 'px;width:' + a2.w + 'px';
      if (c.label) made.push(chip(id + '-L', c.label, a2.x + a2.w + 26, cy, rise, null, null));

    } else if (c.t === 'step'){
      var a3 = rowRect(f, c.from), b3 = rowRect(f, c.to); if (!a3 || !b3) return;
      // grows FROM a3 TOWARD b3, head landing on b3 — direction follows the rows, not the
      // screen. `to` below `from` points down; `to` above points up.
      var down = b3.cy > a3.cy;
      var y1 = Math.min(a3.cy, b3.cy), y0 = Math.max(a3.cy, b3.cy);
      el = document.createElement('div');
      el.className = 'hst' + (down ? ' is-down' : ''); el.id = id;
      el.style.cssText += 'left:' + (a3.x + a3.w + 20) + 'px;top:' + y1 + 'px;height:' +
                          (y0 - y1) + 'px';
      el.innerHTML = '<div class="hst-head"></div>';
      if (c.label) made.push(chip(id + '-L', c.label, a3.x + a3.w + 44, (y0 + y1) / 2,
                                  true, null, null));
    }
    if (el) ann.appendChild(el);
  });
  made.forEach(function(m){ ann.appendChild(m.chip); if (m.lead) ann.appendChild(m.lead); });
  auditChips();   // measured after layout, never guessed

  // ---- ROW-ANCHORED ANNOTATIONS MUST FOLLOW THE CAPTURE WHEN IT PANS -------------------
  // Annotations live in #hud-ann, a SIBLING of the capture, so they do not inherit its
  // transform. With a single static framing that is invisible. The moment the capture pans,
  // every highlight stays put while the rows slide out from under it — on 2026-08-04 the
  // "A YEAR AGO" chip slid off frame and the tint landed on Opus 5 instead of Opus 4.
  //
  // Fix: tween each anchored annotation by the SAME delta as the pan, on the same schedule.
  // Keeping them out of the transform (rather than parenting them into it) means chip text
  // never scales — a zoom must not change how big the label is.
  var ANCHORED = {acquire:1, pointer:1, bracket:1, flatline:1, step:1};
  (o.moves || []).forEach(function(m){
    var f2 = frame(FR[m.to]);
    cues.forEach(function(c, i){
      if (!ANCHORED[c.t] || m.at <= c.at + 0.5) return;
      var f1 = framingAt(c.at);
      // Row anchors only translate if the SCALE is unchanged. A pan that also zooms would
      // need the boxes resized, which they are not — so require equal sw and say so loudly.
      if (Math.abs(f2.scale - f1.scale) > 1e-6){
        console.warn('[hud] move to "' + m.to + '" changes scale while row annotations are ' +
          'live — anchors will drift. Give every row-anchored framing the same `sw`.');
      }
      var dx = f2.x - f1.x, dy = f2.y - f1.y, sel = '#hud-c' + i;
      var opts = {x:dx, y:dy, duration:m.dur || 1.6, ease:m.ease || 'power2.inOut'};
      to_(sel, opts, m.at);
      if (c.label){
        to_(sel + '-L', {x:dx, y:dy, duration:opts.duration, ease:opts.ease}, m.at);
        to_(sel + '-L-lead', {x:dx, y:dy, duration:opts.duration, ease:opts.ease}, m.at);
      }
    });
  });

  function chip(cid, text, x, cy, rise, leadX, leadY){
    var d = document.createElement('div');
    d.className = 'hchip' + (rise ? ' is-rise' : ''); d.id = cid; d.textContent = text;
    d.style.cssText += 'left:' + x + 'px;top:' + cy + 'px;transform:translateY(-50%)';
    var lead = null;
    if (leadX != null){
      lead = document.createElement('div');
      lead.className = 'hlead' + (rise ? ' is-rise' : ''); lead.id = cid + '-lead';
      lead.style.cssText += 'left:' + leadX + 'px;top:' + leadY + 'px;width:' + (x - leadX) + 'px';
    }
    return { chip:d, lead:lead };
  }

  // Chips live in the gutter between the table's right edge and the box edge. Frame the
  // capture WIDER than the table (include the page's right margin) to create that gutter —
  // see the demo's `table` framing. A chip that runs past the box would also run past the
  // 1920 canvas, which the layout checker flags as canvas_overflow.
  //
  // If this fires, SHORTEN THE LABEL — do not widen the gutter by shrinking the capture.
  // Labels are semantic ("A YEAR AGO", "NO CHANGE", "+50%"), never a re-typing of the rate:
  // the numbers are the capture's own pixels and that is the whole point of the component.
  function auditChips(){
    var over = [];
    document.querySelectorAll('#hud .hchip').forEach(function(d){
      var right = parseFloat(d.style.left) + d.getBoundingClientRect().width;
      if (right > vp.w - 8) over.push(d.textContent + ' (+' + Math.round(right - vp.w) + 'px)');
    });
    if (over.length) console.warn('[hud] chip overflows the capture box — shorten it: ' +
                                  over.join(' · '));
  }

  // ---- timeline ------------------------------------------------------------------------
  var boxIn = (o.boxIn != null) ? o.boxIn : (cues.length ? cues[0].at - 0.4 : S);
  at('#hud', {opacity:0, scale:1.012}, {opacity:1, scale:1, duration:.6, ease:'power3.out'}, boxIn);
  gsap.set('#hud-cap', {scale:cur.scale, x:cur.x, y:cur.y});
  // the always-on drift. One tween, one element, whole scene, never loops. This is what keeps
  // a "held" capture from reading as a still frame to both the eye and the density gate.
  if (o.drift !== false){
    var dz = o.drift || 0.035;
    gsap.set('#hud-drift', {scale:1 + dz/2, x:0, y:0});
    tl.to('#hud-drift', {scale:1 + dz, x:-dz*260, duration:o.driftDur || 60, ease:'none'}, 0);
  }

  (o.moves || []).forEach(function(m){
    var f = frame(FR[m.to]);
    to_('#hud-cap', {scale:f.scale, x:f.x, y:f.y, duration:(m.dur || 1.6),
                     ease:m.ease || 'power2.inOut'}, m.at);
  });

  cues.forEach(function(c, i){
    var id = '#hud-c' + i, t = c.at;
    if (c.t === 'kicker'){
      at('#hud-kick', {opacity:0, x:-8}, {opacity:1, x:0, duration:.45, ease:'power3.out'}, t);

    } else if (c.t === 'acquire'){
      at(id, {opacity:0}, {opacity:1, duration:.01, ease:'none'}, t);
      at(id + '-t', {scaleX:0}, {scaleX:1, duration:.52, ease:'power3.out'}, t);
      at(id + ' .hq-tl', {opacity:0, x:9,  y:9},  {opacity:1, x:0, y:0, duration:.34, ease:'power3.out'}, t, .06);
      at(id + ' .hq-tr', {opacity:0, x:-9, y:9},  {opacity:1, x:0, y:0, duration:.34, ease:'power3.out'}, t, .10);
      at(id + ' .hq-bl', {opacity:0, x:9,  y:-9}, {opacity:1, x:0, y:0, duration:.34, ease:'power3.out'}, t, .14);
      at(id + ' .hq-br', {opacity:0, x:-9, y:-9}, {opacity:1, x:0, y:0, duration:.34, ease:'power3.out'}, t, .18);

    } else if (c.t === 'bracket'){
      at(id, {opacity:0}, {opacity:1, duration:.01, ease:'none'}, t);
      at(id + '-s', {scaleY:0}, {scaleY:1, duration:.55, ease:'power3.inOut'}, t);

    } else if (c.t === 'flatline'){
      at(id, {scaleX:0}, {scaleX:1, duration:.75, ease:'power2.inOut'}, t);

    } else if (c.t === 'step'){
      at(id, {opacity:0}, {opacity:1, duration:.01, ease:'none'}, t);
      at(id, {scaleY:0}, {scaleY:1, duration:.50, ease:'power3.out'}, t, .02);

    } else if (c.t === 'pointer'){
      // The THROB goes on the inner element; the OUTER one carries opacity and, when the
      // capture pans, the follow tween. Both on one element would be two tweens on `x` in
      // overlapping windows — the pattern that renders FROZEN.
      at(id, {opacity:0}, {opacity:1, duration:.34, ease:'power3.out'}, t);
      var pdur = (c.until != null ? c.until : t + 6) - t;
      if (!past(t) && pdur > 0){
        // repeat+yoyo on a paused timeline is deterministic under SEEK
        tl.fromTo(id + '-in', {x:-7},
                  {x:7, duration:.62, ease:'sine.inOut',
                   repeat:Math.max(1, Math.round(pdur/.62)), yoyo:true}, L(t) + .30);
      }
      if (c.until != null) to_(id, {opacity:0, duration:.3, ease:'power2.in'}, c.until);
      return;

    } else if (c.t === 'note'){
      at(id + '-L', {opacity:0, x:-10}, {opacity:1, x:0, duration:.42, ease:'power3.out'}, t);
      return;

    } else if (c.t === 'release'){
      // Fade ONLY what has already fired. Targeting every child would blank annotations
      // that have not appeared yet — and several reveals (flatline, tint, leader) animate
      // scale, not opacity, so they would never come back.
      cues.forEach(function(p, j){
        if (j >= i || p.t === 'release' || p.at > t) return;
        var pid = '#hud-c' + j;
        to_(pid, {opacity:0, duration:.45, ease:'power2.in'}, t);
        if (p.t === 'note') to_(pid + '-L', {opacity:0, duration:.45, ease:'power2.in'}, t);
        if (p.label){
          to_(pid + '-L',      {opacity:0, duration:.45, ease:'power2.in'}, t);
          to_(pid + '-L-lead', {opacity:0, duration:.45, ease:'power2.in'}, t);
        }
      });
      return;
    }
    if (c.label){
      at(id + '-L-lead', {scaleX:0}, {scaleX:1, duration:.30, ease:'power2.out'}, t, .26);
      at(id + '-L', {opacity:0, x:-10}, {opacity:1, x:0, duration:.40, ease:'power3.out'}, t, .34);
    }
  });

  if (o.holdOut != null) to_('#hud', {opacity:0, duration:.5, ease:'power2.in'}, o.holdOut);
}
</script>
