<!-- ============================================================================
     WORD-SYNCED CITATION CARD — the LA "karaoke" technique.
     Spec: .claude/rules/video-production-standard.md §10.2 (Terry, 2026-07-30).

     A cream evidence card appears; its quote is then HIGHLIGHTED WORD BY WORD in
     lockstep with the VO reading it. Pending words sit dim; each word snaps to full
     ink at its VO word-start time; a gold underline tracks how far the read has got.

     WHY THIS IS SAFE UNDER THE RENDERER. Every word is ONE independent tween
     (dim -> full) at its own start time. No two tweens touch the same property on the
     same element, so the spine's breath-vs-resolve overwrite bug CANNOT recur here.
     All motion on the registered tl; a bare gsap.to renders FROZEN.

     ---- HOW TO GET THE WORD TIMES (build step, do NOT eyeball) --------------------
     The times come from the VO transcript, the same {text,start} token JSON cue.py
     reads. At build time:
        python3 tools/cue.py <scene-transcript.json> "<the exact quote words>"
     or read the token array directly and slice the quote's span. Pass the result as
     opts.words = [{w:"before", t:12.30}, {w:"those", t:12.54}, ...].
     NEVER hand-invent the timings for a real build — they must be the VO's actual
     word starts or the karaoke drifts off the voice. (The demo fabricates them; a
     real scene must not.)

     ---- USAGE --------------------------------------------------------------------
       BLOCK A -> scene <style>;  BLOCK B markup -> a child of #root;  BLOCK C -> after
       the scene's own tl calls. Then once:

         mountQuoteCard(tl, {
           kicker: "OPENAI · JULY 2026",
           words:  [{w:"an",t:2.0},{w:"early",t:2.24}, ... ],   // from cue.py
           attribution: "OpenAI, “How AI is expanding what people do at work”",
           cardIn: 1.0,          // when the card fades in (default 0.4)
           holdOut: null         // optional t to fade the card out; null = stays
         });

     opts.words[i].t is the VO start of that word. Punctuation stays attached to its
     word. The renderer maps 'EB Garamond'/'JetBrains Mono' to bundled fonts.
============================================================================ -->

<!-- ============================ BLOCK A — style ============================ -->
<style>
  /* cream evidence register — matches make-pullquote-card.py (#F4F1EA / Georgia ink) */
  #qc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;
      width:1180px;opacity:0;will-change:opacity,transform}
  #qc .qc-card{position:relative;background:#F4F1EA;border-radius:6px;
      padding:64px 76px 58px;box-shadow:0 40px 120px rgba(0,0,0,.62);
      border:1px solid #E4DDCB}
  #qc .qc-kick{font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.34em;
      text-transform:uppercase;color:#8A7B57;font-weight:700}
  #qc .qc-rule{height:2px;background:#16181C;opacity:.16;margin:22px 0 34px;
      transform-origin:0 50%}
  /* the quote — words are spans; pending dim, read full-ink */
  #qc .qc-quote{font-family:'EB Garamond',Georgia,serif;font-size:60px;line-height:1.30;
      color:#16181C;font-weight:700}
  #qc .qc-w{opacity:.24;transition:none;white-space:pre}       /* pending ink */
  #qc .qc-w.lit{opacity:1}                                     /* set by tween, not CSS */
  /* the read-progress underline sweeping beneath the text */
  #qc .qc-underwrap{position:relative;height:0}
  #qc .qc-attr{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:24px;
      letter-spacing:.06em;color:#6B5F45;font-weight:600}
  #qc .qc-seal{position:absolute;right:60px;bottom:52px;width:70px;height:70px;
      border:2px solid #C9B27A;border-radius:50%;opacity:.55;
      display:flex;align-items:center;justify-content:center}
  #qc .qc-seal:after{content:"";width:34px;height:34px;border:1px solid #C9B27A;
      border-radius:50%}
</style>

<!-- =========================== BLOCK B — markup =========================== -->
<!-- child of #root. #qc-quote is filled by mountQuoteCard (word spans injected). -->
<div id="qc">
  <div class="qc-card">
    <div class="qc-kick" id="qc-kick"></div>
    <div class="qc-rule" id="qc-rule"></div>
    <div class="qc-quote" id="qc-quote"></div>
    <div class="qc-attr" id="qc-attr"></div>
    <div class="qc-seal"></div>
  </div>
</div>

<!-- =========================== BLOCK C — script =========================== -->
<script>
function mountQuoteCard(tl, o){
  var box = document.getElementById('qc-quote');
  var words = o.words || [];
  document.getElementById('qc-kick').textContent = o.kicker || '';
  document.getElementById('qc-attr').textContent = o.attribution || '';

  // build one span per word (punctuation rides with its word; a trailing space span
  // keeps natural wrapping without the space itself lighting up)
  box.innerHTML = '';
  var spans = [];
  words.forEach(function(item, i){
    var s = document.createElement('span');
    s.className = 'qc-w'; s.id = 'qc-w-' + i; s.textContent = item.w;
    box.appendChild(s); spans.push(s);
    if (i < words.length - 1) box.appendChild(document.createTextNode(' '));
  });

  var cardIn = (o.cardIn != null) ? o.cardIn : 0.4;

  // card in — fast, then it stays put (one tween, one property window)
  tl.fromTo('#qc', {opacity:0, y:24}, {opacity:1, y:0, duration:.5, ease:'power3.out'}, cardIn);
  tl.fromTo('#qc-rule', {scaleX:0}, {scaleX:1, duration:.6, ease:'power3.inOut'}, cardIn + .15);

  // per-word highlight: ONE independent opacity tween each, at its VO word-start.
  // dim -> full. No overlap between words (each targets a different element).
  words.forEach(function(item, i){
    var t = Math.max(item.t, cardIn + .5);   // never light a word before the card is in
    tl.to('#qc-w-' + i, {opacity:1, duration:.18, ease:'power1.out'}, t);
  });

  // optional: fade the whole card out at holdOut
  if (o.holdOut != null){
    tl.to('#qc', {opacity:0, y:-18, duration:.45, ease:'power2.in'}, o.holdOut);
  }
}
</script>
